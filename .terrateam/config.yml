# Two environments, dev and prod.  Each has three layers that must run in
# order.  The ordering inside an environment comes from layered runs
# (when_modified.depends_on).  The grouping comes from stacks, selected by the
# environment tag of each directory.  The prod stack applies only after the dev
# stack.
dirs:
  dev/networking:
    tags:
      - dev
  dev/database:
    tags:
      - dev
    when_modified:
      depends_on: 'dir:dev/networking'
  dev/app:
    tags:
      - dev
    when_modified:
      depends_on: 'dir:dev/database'
  prod/networking:
    tags:
      - prod
  prod/database:
    tags:
      - prod
    when_modified:
      depends_on: 'dir:prod/networking'
  prod/app:
    tags:
      - prod
    when_modified:
      depends_on: 'dir:prod/database'

stacks:
  names:
    dev:
      tag_query: 'dev'
    prod:
      tag_query: 'prod'
      rules:
        apply_after:
          - dev

engine:
  name: tofu
