# The same repository as 0008, with all in place of by_phase.  all has no wall
# between the phases, so the whole job takes one action run.  The pair of
# fixtures is what shows that the wall of by_phase is the only thing that makes
# the second run.
batch_runs:
  merge_steps: all

# The three steps that prepare a job.  The tree builder gives the tree of the
# repository, and the config builder turns the indexer on.
tree_builder:
  enabled: true
  script: '${TERRATEAM_ROOT}/bin/tree-builder'

config_builder:
  enabled: true
  script: |
    #! /usr/bin/env python3
    import json
    import sys
    config = json.loads(sys.stdin.read())
    config.setdefault('indexer', {})['enabled'] = True
    print(json.dumps(config))

dirs:
  database1:
    when_modified:
      depends_on: dir:base
  database2:
    when_modified:
      depends_on: dir:base
  webservice:
    when_modified:
      depends_on: dir:database1 or dir:database2

engine:
  name: tofu
