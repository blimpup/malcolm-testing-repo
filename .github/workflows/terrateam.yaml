 ##########################################################################
 # DO NOT MODIFY
 #
 # THIS FILE SHOULD LIVE IN .github/workflows/terrateam.yml
 #
 # Looking for the Terrateam configuration file? .terrateam/config.yml.
 #
 # See https://docs.terrateam.io/configuration/overview for details
 ##########################################################################
 name: 'Terrateam Workflow'
 run-name: "Terrateam ${{ inputs.run-kind }} ${{ inputs.run-type }} ${{ inputs.pr-number }} ${{ inputs.pr-title }}"
 on:
   workflow_dispatch:
     inputs:
       # The work-token and api-base-url are automatically passed in by the Terrateam backend
       work-token:
         description: 'Work Token'
         required: true
       api-base-url:
         description: 'API Base URL'
       environment:
         description: 'Environment in which to run the action'
         type: environment
       run-kind:
         default: ""
       run-type:
         default: ""
       pr-title:
         default: ""
       pr-number:
         default: ""
 jobs:
   terrateam:
     permissions: # Required to pass credentials to the Terrateam action
       id-token: write
       contents: read
     runs-on: ubuntu-latest
     timeout-minutes: 1440
     name: Terrateam Action
     environment: '${{ github.event.inputs.environment }}'
     steps:
       - uses: actions/checkout@v4
       # The local backend writes the state into the workspace, and GitHub deletes the workspace at
       # the end of the job, so a fixture that declares no backend starts every run from nothing.
       # These two steps carry the state from one run of this branch to the next, which is what a
       # test of successive applies needs.
       #
       # The key holds the run id because the cache service does not replace a key that exists; the
       # prefix in [restore-keys] reads the most recent entry back.  [github.ref_name] scopes the
       # entries to the branch of one test attempt, so a retry starts from an empty cache.
       - name: Restore Terraform state
         uses: actions/cache/restore@v4
         with:
           path: |
             **/terraform.tfstate
             **/terraform.tfstate.d
           key: tfstate-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
           restore-keys: |
             tfstate-${{ github.ref_name }}-
       - name: Run Terrateam Action
         id: terrateam
         uses: terrateamio/action@1929-add-resource-summary
         with:
           work-token: '${{ github.event.inputs.work-token }}'
           api-base-url: '${{ github.event.inputs.api-base-url }}'
         env:
           SECRETS_CONTEXT: ${{ toJson(secrets) }}
       # [always] because the state must survive an apply that stops in the middle.
       # [continue-on-error] because the first plan of a directory has no state file yet, and the
       # save step makes an error when the path matches nothing.
       - name: Save Terraform state
         if: always()
         continue-on-error: true
         uses: actions/cache/save@v4
         with:
           path: |
             **/terraform.tfstate
             **/terraform.tfstate.d
           key: tfstate-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
